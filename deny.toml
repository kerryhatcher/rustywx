# cargo-deny configuration for rustywx
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
ignore = [
    # ttf-parser 0.21.1 is unmaintained; transitive via ply-engine
    # → macroquad-ply → fontdue. No fix available upstream until ply-engine
    # updates its font rendering backend. Pinned in fontdue 0.9.3.
    "RUSTSEC-2026-0192",
    # zbus_names, zvariant, and zvariant_derive are unmaintained. All three
    # are transitive via ply-engine → accesskit_unix → zbus, the Linux
    # accessibility (AT-SPI) backend — not reachable on the macOS/Windows
    # builds this app actually ships, and not a direct dependency we can
    # swap out. Bumped to the latest available versions (zbus_names
    # 4.3.5, zvariant/zvariant_derive 5.15.1); the advisories are against
    # the crates' maintenance status, not a specific version, so no bump
    # clears them.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
    "CC-BY-SA-4.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
